        body {

            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 45px;
            color: #8deaff;

        }

        h2 {
            text-align: center;

        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .btn {
            width: 280px;
            padding: 25px;
            background: rgba(255,255,255,0.08);
            border-radius: 18px;
            text-decoration: none;
            color: #cfffff;
            border: 2px solid #00eaff;
            font-size: 22px;
            font-weight: bold;
            transition: .3s;
            backdrop-filter: blur(5px);
            text-shadow: 0 0 10px #00eaff;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px #00eaff;
            background: rgba(0,255,255,0.25);
        }

        .separador {
            width: 80%;
            height: 1px;
            margin: 45px auto;
            background: #00eaff;
            box-shadow: 0 0 10px #00eaff;
            opacity: 0.5;
        }
